<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prapti – Receivables Aging Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@2.31.0/dist/full.css"
      rel="stylesheet"
    />
    <link href="/frontend/static/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div
        class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center"
      >
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-gray-800 mb-2">Prapti</h1>
          <p class="text-lg text-gray-600">Receivables Aging Dashboard</p>
          <p class="text-sm text-gray-500 mt-1">By Gireesh</p>
        </div>

        <div class="mb-8">
          <p class="text-gray-600 mb-6">
            Welcome to your accounts receivable management system. Track and
            analyze customer invoices with comprehensive aging reports.
          </p>
        </div>

        <button
          onclick="window.location.href='/customer'"
          class="btn btn-primary w-full py-3 text-lg"
        >
          Get Started
          <svg
            class="w-5 h-5 ml-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            ></path>
          </svg>
        </button>

        <div class="mt-8 pt-6 border-t border-gray-200">
          <p class="text-sm text-gray-500">
            Manage your receivables efficiently
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
