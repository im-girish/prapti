<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prapti – Receivables Aging Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@2.31.0/dist/full.css"
      rel="stylesheet"
    />
    <link href="/frontend/static/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div
        class="bg-white rounded-2xl shadow-xl p-10 max-w-2xl w-full text-center"
      >
        <!-- Logo/Header - Enlarged -->
        <div class="mb-12">
          <h1 class="text-5xl font-bold text-gray-800 mb-4">Prapti</h1>
          <div class="space-y-3">
            <p class="text-2xl text-gray-700 font-semibold">
              Receivables Aging Dashboard
            </p>
            <p class="text-lg text-gray-600">By Gireesh</p>
          </div>
        </div>

        <!-- Welcome Message - Enlarged -->
        <div class="mb-12">
          <p class="text-xl text-gray-600 leading-relaxed">
            Welcome to your accounts receivable management system. Track and
            analyze customer invoices with comprehensive aging reports.
          </p>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-200 my-8"></div>

        <!-- Get Started Button - Enlarged -->
        <button
          onclick="window.location.href='/customer'"
          class="get-started-btn"
        >
          GET STARTED
          <svg
            class="w-6 h-6 ml-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            ></path>
          </svg>
        </button>

        <!-- Footer - Enlarged -->
        <div class="mt-12 pt-8 border-t border-gray-200">
          <p class="text-base text-gray-500 font-medium">
            Manage your receivables efficiently
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
