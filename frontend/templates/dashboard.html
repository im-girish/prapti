<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prapti Receivables Dashboard</title>

  <!-- Tailwind + DaisyUI CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@2.31.0/dist/full.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Static assets served via FastAPI StaticFiles -->
  <link href="/frontend/static/css/style.css" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.ico" />
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Prapti – Receivables Aging Dashboard By Giri!!</h1>

    <div class="mb-4">
      <label for="customerId" class="block mb-2 font-semibold">Enter Customer ID:</label>
      <input type="text" id="customerId" class="input input-bordered w-full max-w-xs" value="test_customer" />
      <button id="fetchBtn" class="btn btn-primary mt-3">Fetch Report</button>
    </div>

    <section id="summary" class="bg-white shadow rounded p-4 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4">Aging Summary ($)</h2>
      <table class="table w-full">
        <thead><tr><th>Bucket</th><th>Amount</th></tr></thead>
        <tbody id="summaryData"></tbody>
      </table>

      <!-- Chart wrapper keeps the pie small and centered -->
      <div class="chart-wrap">
        <canvas id="agingChart" class="mt-4" width="500px" height="500px" style="display: block; box-sizing: border-box;"></canvas>
      </div>
    </section>

    <section id="details" class="bg-white shadow rounded p-4 hidden">
      <h2 class="text-xl font-semibold mb-4">Invoice Details</h2>
      <table class="table w-full">
        <thead>
          <tr>
            <th>Invoice #</th>
            <th>Invoice Date</th>
            <th>Due Date</th>
            <th>Amount Due</th>
            <th>Amount Paid</th>
            <th>Outstanding</th>
            <th>Aging Days</th>
          </tr>
        </thead>
        <tbody id="detailsData"></tbody>
      </table>
    </section>
  </div>

  <!-- App script -->
  <script src="/frontend/static/js/interactivity.js" defer></script>
</body>
</html>
